name: Validate and deploy Little Georgies

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check content
        run: npm run check:content

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-west-1

      - name: Sync Little Georgies path
        run: aws s3 sync dist/little-georgies/ "s3://georgist.org/little-georgies/" --delete

      - name: Upload top-level link page
        run: aws s3 cp dist/index.html "s3://georgist.org/index.html"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "E1QMD3NCCUN9RC" --paths "/" "/index.html" "/little-georgies/*"
