<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18312d">
    <title>Georgist.org</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17211e;
        --muted: #5f6964;
        --paper: #f7f1e6;
        --forest: #18312d;
        --amber: #b77828;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 22px;
        color: var(--ink);
        background:
          linear-gradient(180deg, rgba(24, 49, 45, 0.1), rgba(247, 241, 230, 0) 310px),
          var(--paper);
        place-items: center;
      }

      main {
        width: min(720px, 100%);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--amber);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2.4rem, 8vw, 5.4rem);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        max-width: 58ch;
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }

      .link-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 18px;
        border-radius: 8px;
        color: #fffaf0;
        font-weight: 850;
        text-decoration: none;
        background: var(--forest);
      }

      a.secondary {
        color: var(--forest);
        background: rgba(24, 49, 45, 0.1);
      }

      a:hover,
      a:focus-visible {
        outline: 3px solid rgba(183, 120, 40, 0.36);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Georgist.org</p>
      <h1>The Common Rent</h1>
      <p>
        Browser-based games about land, rents, public revenue, and the politics of
        building a fairer realm.
      </p>
      <div class="link-row" aria-label="Games">
        <a href="/little-georgies/">Play Little Georgies</a>
        <a class="secondary" href="/auction/">Play the auction game</a>
      </div>
    </main>
  </body>
</html>
